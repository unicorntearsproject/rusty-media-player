# The full test suite, on demand only (workflow_dispatch). Nothing runs on a push or a pull request.
name: Check

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if this commit already passed'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # CI only runs on changes: skip when this commit already passed this workflow.
  gate:
    name: Gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: tools/ci/gate.sh check.yml

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev python3 python3-pil \
            xvfb xauth playerctl dbus-x11 fonts-noto-cjk libxkbcommon-x11-0 libx11-6 libxcursor1 libxi6 libxrandr2 libwayland-client0 libxkbcommon-x11-0 libx11-6 libxcursor1 libxi6 libxrandr2 libwayland-client0
      # Ubuntu's ffmpeg has no AV1 encoder (libsvtav1); the full fixture set needs one.
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        env:
          RVP_REQUIRE_DESKTOP_TESTS: '1'
        run: dbus-run-session -- xvfb-run -a cargo test --workspace
      - run: cargo xtask check
