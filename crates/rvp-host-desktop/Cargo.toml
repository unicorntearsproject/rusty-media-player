[package]
name = "rvp-host-desktop"
description = "Native desktop host (Linux and Windows) and the `rvp` binary: winit window, softbuffer surface, cpal audio, rfd dialogs, system media controls"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
rvp-core.workspace = true
rvp-host.workspace = true
rvp-par.workspace = true
rvp-app.workspace = true
rvp-ui.workspace = true
rvp-library.workspace = true
rvp-codec-audio.workspace = true
rvp-codec-av1.workspace = true
rvp-codec-h264.workspace = true
rvp-codec-vp9.workspace = true
winit = "0.30"
softbuffer = "0.4"
cpal = "0.18"
rfd = "0.17"
souvlaki = { path = "../../third_party/souvlaki" }
directories = "6"
fontdb = "0.24"
ttf-parser = "0.25"
raw-window-handle = "0.6"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[[bin]]
name = "rvp"
path = "src/main.rs"
