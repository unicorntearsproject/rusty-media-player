[package]
name = "rvp-host-web"
description = "Browser host (wasm-bindgen); compiles to an empty crate on non-wasm targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
rvp-core.workspace = true
rvp-par.workspace = true
rvp-host.workspace = true
rvp-app.workspace = true
rvp-ui.workspace = true
rvp-codec-audio = { path = "../rvp-codec-audio" }
rvp-codec-av1 = { path = "../rvp-codec-av1" }
rvp-codec-h264 = { path = "../rvp-codec-h264" }
rvp-codec-hevc = { path = "../rvp-codec-hevc" }
rvp-codec-vp9 = { path = "../rvp-codec-vp9" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "File", "Blob",
    "Performance", "Storage", "console",
] }
