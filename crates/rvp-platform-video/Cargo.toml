[package]
name = "rvp-platform-video"
description = "The system's own video decoders (VA-API, VideoToolbox, Media Foundation) behind rvp_core::PlatformVideo"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rvp-core.workspace = true
rvp-codec-hevc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[dev-dependencies]
rvp-demux.workspace = true
rvp-host.workspace = true
