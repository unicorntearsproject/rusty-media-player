[workspace]
resolver = "3"
exclude = ["third_party/rav1d", "third_party/rusty_vp9", "third_party/souvlaki", "fuzz"]
members = [
    "crates/theme",
    "crates/rvp-core",
    "crates/rvp-par",
    "crates/rvp-host",
    "crates/rvp-demux",
    "crates/rvp-codec-audio",
    "crates/rvp-codec-h264",
    "crates/rvp-codec-hevc",
    "crates/rvp-platform-video",
    "crates/rvp-codec-av1",
    "crates/rvp-codec-vp9",
    "crates/rvp-subs",
    "crates/rvp-viz",
    "crates/rvp-library",
    "crates/rvp-tagwrite",
    "crates/rvp-player",
    "crates/rvp-ui",
    "crates/rvp-app",
    "crates/rvp-host-headless",
    "crates/rvp-host-web",
    "crates/rvp-host-rb",
    "crates/bucket-v0-sys",
    "crates/bucket-v0-mock",
    "crates/rvp-wave-bucket",
    "crates/rvp-update",
    "crates/rvp-host-desktop",
    "crates/rvp-wasm-smoke",
    "xtask",
]

[workspace.package]
version = "1.0.0-rc9"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unicorntearsproject/rusty-media-player"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
rvp-core = { path = "crates/rvp-core" }
rvp-par = { path = "crates/rvp-par" }
rvp-host = { path = "crates/rvp-host" }
rvp-codec-audio = { path = "crates/rvp-codec-audio" }
rvp-codec-av1 = { path = "crates/rvp-codec-av1" }
rvp-codec-h264 = { path = "crates/rvp-codec-h264" }
rvp-codec-hevc = { path = "crates/rvp-codec-hevc" }
rvp-platform-video = { path = "crates/rvp-platform-video" }
rvp-codec-vp9 = { path = "crates/rvp-codec-vp9" }
rvp-demux = { path = "crates/rvp-demux" }
rvp-subs = { path = "crates/rvp-subs" }
rvp-viz = { path = "crates/rvp-viz" }
rvp-library = { path = "crates/rvp-library" }
rvp-tagwrite = { path = "crates/rvp-tagwrite" }
rvp-player = { path = "crates/rvp-player" }
rvp-ui = { path = "crates/rvp-ui" }
rvp-app = { path = "crates/rvp-app" }
theme = { path = "crates/theme" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# What the desktop packages are built with (`cargo xtask dist`): the release profile, but unwinding, so a panic on a helper thread (the
# media-controls service, a dialog) cannot take the whole player down, and stripped.
[profile.dist]
inherits = "release"
panic = "unwind"
strip = true

# Third-party codecs (rav1d, opus-decoder, symphonia) are far too slow unoptimised and dominate test time;
# our own crates stay at opt-level 0 for debuggability. rav1d's debug assertions track every disjoint borrow
# at runtime and make decoding about 15x slower, so they are off for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.test.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Playback in a debug build must keep real time on a small shared CI runner (the desktop smoke tests check the clock): the crates on the
# playback path get light optimisation in dev and test builds. The SIMD kernels also call intrinsics through thin wrappers, which unoptimised
# are real calls per lane operation.
[profile.dev.package.rvp-core]
opt-level = 2
[profile.dev.package.rvp-codec-h264]
opt-level = 2
[profile.dev.package.rvp-ui]
opt-level = 2
[profile.dev.package.rvp-app]
opt-level = 2
[profile.dev.package.rvp-host-desktop]
opt-level = 2
[profile.dev.package.rvp-viz]
opt-level = 2
[profile.test.package.rvp-viz]
opt-level = 2
[profile.dev.package.rvp-par]
opt-level = 2
[profile.test.package.rvp-core]
opt-level = 2
[profile.test.package.rvp-codec-h264]
opt-level = 2
[profile.test.package.rvp-ui]
opt-level = 2
[profile.test.package.rvp-app]
opt-level = 2
[profile.test.package.rvp-host-desktop]
opt-level = 2
[profile.test.package.rvp-par]
opt-level = 2
