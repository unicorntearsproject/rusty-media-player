[workspace]
resolver = "3"
members = [
    "crates/theme",
    "crates/rvp-core",
    "crates/rvp-host",
    "crates/rvp-demux",
    "crates/rvp-codec-audio",
    "crates/rvp-codec-h264",
    "crates/rvp-codec-av1",
    "crates/rvp-codec-vp9",
    "crates/rvp-subs",
    "crates/rvp-player",
    "crates/rvp-ui",
    "crates/rvp-host-headless",
    "crates/rvp-host-web",
    "crates/rvp-host-rb",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iDoMeteor/rusty-video-player"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
rvp-core = { path = "crates/rvp-core" }
rvp-host = { path = "crates/rvp-host" }
rvp-codec-audio = { path = "crates/rvp-codec-audio" }
rvp-demux = { path = "crates/rvp-demux" }
rvp-player = { path = "crates/rvp-player" }
theme = { path = "crates/theme" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
