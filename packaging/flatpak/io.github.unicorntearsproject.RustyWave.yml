# Flatpak manifest for Rusty Wave.
#
# The crates are vendored offline: `cargo-sources.json` lists every crate of Cargo.lock with its checksum (regenerate it with
# `cargo xtask dist flatpak-sources` whenever Cargo.lock changes) and the build runs `cargo --offline`, as Flathub requires.
# The program source is the release tag below; `cargo xtask dist flatpak` swaps it for a tarball of the working tree (between the
# APP-SOURCE markers) to build what you have locally. See docs/packaging.md.
app-id: io.github.unicorntearsproject.RustyWave
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rusty-wave
finish-args:
  # A window: Wayland, falling back to X11. The picture is drawn on the CPU, so no GPU access is requested.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Sound through PipeWire's PulseAudio socket.
  - --socket=pulseaudio
  # The user's music and videos, read and write (the tag editor rewrites files, safely: a temporary file beside the original, then a rename).
  # Anywhere else the file chooser portal hands over what the user picks.
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  # Fetching a theme from a link (a Claude Design page or a style sheet) the user pastes. Updates stay with Flatpak itself.
  - --share=network
  # "Set as default media player": the user's own mimeapps.list on the host (the one file, not the config folder).
  - --filesystem=xdg-config/mimeapps.list
  # MPRIS: playerctl, the desktop's media widget and the media keys talk to org.mpris.MediaPlayer2.<name>.
  - --own-name=org.mpris.MediaPlayer2.io.github.unicorntearsproject.RustyWave
  - --own-name=org.mpris.MediaPlayer2.io.github.unicorntearsproject.RustyWave.*
cleanup:
  - /share/man
modules:
  - name: rusty-wave
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rusty-wave/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --profile dist --locked -p rvp-host-desktop
      - install -Dm755 target/dist/rusty-wave /app/bin/rusty-wave
      - install -Dm644 packaging/shared/io.github.unicorntearsproject.RustyWave.desktop /app/share/applications/io.github.unicorntearsproject.RustyWave.desktop
      # Stamp the AppStream file with the version of Cargo.toml (RVP_VERSION overrides it) and the date of the source.
      - V=${RVP_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}; D=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" +%F); VA=$(printf '%s' "$V" | sed 's/-/~/'); sed -e "s/@VERSION@/$VA/" -e "s/@DATE@/$D/" packaging/shared/io.github.unicorntearsproject.RustyWave.metainfo.xml.in > rusty-wave.metainfo.xml
      - install -Dm644 rusty-wave.metainfo.xml /app/share/metainfo/io.github.unicorntearsproject.RustyWave.metainfo.xml
      - for s in 16 22 24 32 48 64 96 128 192 256 512; do install -Dm644 packaging/icons/hicolor/${s}x${s}/apps/io.github.unicorntearsproject.RustyWave.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.unicorntearsproject.RustyWave.png; done
      - install -Dm644 LICENSE-MIT /app/share/licenses/io.github.unicorntearsproject.RustyWave/LICENSE-MIT
      - install -Dm644 LICENSE-APACHE /app/share/licenses/io.github.unicorntearsproject.RustyWave/LICENSE-APACHE
      - install -Dm644 THIRD_PARTY_LICENSES.md /app/share/licenses/io.github.unicorntearsproject.RustyWave/THIRD_PARTY_LICENSES.md
    sources:
      # @APP-SOURCE@
      - type: git
        url: https://github.com/unicorntearsproject/rusty-media-player.git
        tag: v0.0.2
      # @END-APP-SOURCE@
      - cargo-sources.json
